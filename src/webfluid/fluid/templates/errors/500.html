{% extends "base_error.html" %}

{% block error %}
<div class="error-content error-notfound wf-rise">

  <div class="error-icon">⚠️</div>

  <h1 class="error-title">
    {{ _('ERROR_TITLE') }}
  </h1>

  <p class="error-text">
    {{ _('ERROR_MSG') }}
  </p>

  <a href="/" class="error-action">
    {{ _('BACK_HOME') }}
  </a>

</div>
{% endblock %}
