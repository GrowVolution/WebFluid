<!DOCTYPE html>
<html lang="{{ LANG }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width">
</head>

<body style="margin:0;padding:0;background-color:#f7f8f9;">

<table width="100%" cellpadding="0" cellspacing="0" style="background:#f7f8f9;">
  <tr>
    <td align="center">

      <table width="600" cellpadding="0" cellspacing="0"
             style="background:#ffffff;font-family:Arial,sans-serif;border-radius:8px;overflow:hidden;">

        <tr>
          <td style="background:#143153;color:#ffffff;padding:20px;text-align:center;">
            {% block brand %}
            <strong style="font-size:18px;">{{ _('BRAND') }}</strong>
            {% endblock %}
          </td>
        </tr>

        <tr>
          <td style="background:#ffffff;padding:30px;color:#1f2937;">
            {% block content %}{% endblock %}
          </td>
        </tr>

        <tr>
          <td style="background:#eef2f7;padding:20px;font-size:12px;color:#6b7280;text-align:center;">
            {% block legal %}{% endblock %}
          </td>
        </tr>

        <tr>
          <td style="background:#eef2f7;padding:10px;text-align:center;">
            {% block socials %}{% endblock %}
          </td>
        </tr>

        <tr>
          <td style="background:#143153;color:#cbd5e1;padding:15px;text-align:center;font-size:12px;">
            {% block copy %}
            &copy; {{ YEAR | default(2026) }} GrowVolution e.V. – MIT License
            {% endblock %}
          </td>
        </tr>

      </table>

    </td>
  </tr>
</table>

</body>
</html>
