{% extends "base_error.html" %}

{% block error %}
<div class="error-content error-forbidden">

  <div class="error-icon">🚫</div>

  <h1 class="error-title">
    {{ _('FORBIDDEN_TITLE') }}
  </h1>

  <p class="error-text">
    {{ _("FORBIDDEN_MSG") }}
  </p>

  <a href="/" class="error-action-secondary">
    {{ _("BACK_HOME") }}
  </a>

</div>
{% endblock %}
