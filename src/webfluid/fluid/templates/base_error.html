{% extends "fluid_base.html" %}

{% block title %}{{ _('ERROR') }}{% endblock %}

{% block content %}
<div class="error-layout">
    <div class="error-container">

        <div class="error-frame error-{% block accent %}danger{% endblock %}">
            <div class="error-card wf-rise">

                <span class="error-badge">
                    <span class="error-badge-dot"></span>
                    {% block code %}500{% endblock %}
                </span>

                <div class="error-icon">{% block icon %}⚠️{% endblock %}</div>

                <h1 class="error-title">{% block heading %}{% endblock %}</h1>

                <p class="error-text">{% block message %}{% endblock %}</p>

                <a href="/" class="error-action">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M11 6l-6 6 6 6"/>
                    </svg>
                    {{ _('BACK_HOME') }}
                </a>

            </div>
        </div>

    </div>
</div>
{% endblock %}
